name: HO-01 tested checkpoint
on:
  push:
    branches: ['pro/harness-opt-01']
    paths: ['.github/workflows/ho01-checkpoint.yml']
permissions:
  contents: write
concurrency:
  group: ho01-checkpoint
  cancel-in-progress: false
jobs:
  checkpoint:
    if: github.repository == 'stardustx8/AgenticArch' && github.ref == 'refs/heads/pro/harness-opt-01'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify and apply the reviewed public patch
        shell: bash
        run: |
          mkdir -p /tmp/ho01-checkpoint
          python3 - <<'PY'
          import gzip, hashlib, pathlib, subprocess
          root = pathlib.Path('.')
          base = 'e9d018a19c682a468bf83f42305d0934fa97ffec'
          paths = subprocess.check_output(['git','diff','--name-only',base,'HEAD'], text=True).splitlines()
          expected = {'.github/workflows/ho01-checkpoint.yml'} | {f'.ho01-transfer/core.part{i}' for i in range(4)}
          if set(paths) != expected:
              raise SystemExit('branch changed: refusing to apply')
          patch = gzip.decompress(b''.join((root / f'.ho01-transfer/core.part{i}').read_bytes() for i in range(4)))
          if hashlib.sha256(patch).hexdigest() != '55ac8f39c9dd79c1b2c94c7b3df7a992e05cb5389e84ef4b5bc509639cab9098':
              raise SystemExit('patch checksum mismatch')
          p = pathlib.Path('/tmp/ho01-checkpoint/core.patch'); p.write_bytes(patch)
          subprocess.run(['git','apply','--check','--index',str(p)], check=True)
          subprocess.run(['git','apply','--index',str(p)], check=True)
          changed = subprocess.check_output(['git','diff','--cached','--name-only'], text=True).splitlines()
          if not all(p.startswith('aa/') or p in {'tests/test_aa_runtime.py','tools/bench_context.py','docs/RUNTIME.md','docs/DECISIONS.md'} for p in changed):
              raise SystemExit('unexpected destination')
          PY
      - name: Validate Python 3.11 runtime and kit
        shell: bash
        run: |
          python3 --version | tee /tmp/ho01-checkpoint/python-version.txt
          python3 -m unittest discover -s tests -v 2>&1 | tee /tmp/ho01-checkpoint/unittest.txt
          python3 tools/check_kit.py 2>&1 | tee /tmp/ho01-checkpoint/check-kit.txt
      - name: Commit tested changes and remove the one-use transfer
        shell: bash
        run: |
          git rm .github/workflows/ho01-checkpoint.yml .ho01-transfer/core.part*
          git config user.name 'AgenticArch HO-01'
          git config user.email 'stardustx8@users.noreply.github.com'
          git commit -m 'feat(ho01): add tested opt-in context, Stop checks and gate records'
          git push origin HEAD:refs/heads/pro/harness-opt-01
          git rev-parse HEAD > /tmp/ho01-checkpoint/source-sha.txt
          git archive HEAD > /tmp/ho01-checkpoint/source.tar
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ho01-core-checkpoint
          path: /tmp/ho01-checkpoint/
          retention-days: 7
