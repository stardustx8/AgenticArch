name: HO-01 measurement checkpoint
on:
  push:
    branches: ['pro/harness-opt-01']
    paths: ['.github/workflows/ho01-measurement-checkpoint.yml']
permissions:
  contents: write
concurrency:
  group: ho01-checkpoint
  cancel-in-progress: false
jobs:
  checkpoint:
    if: github.repository == 'stardustx8/AgenticArch' && github.ref == 'refs/heads/pro/harness-opt-01'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check the complete patch before applying any change
        shell: bash
        run: |
          mkdir -p /tmp/ho01-measurement/transfer
          cp .ho01-transfer/measurement.part* /tmp/ho01-measurement/transfer/
          python3 - <<'PY'
          import base64, gzip, hashlib, pathlib, subprocess
          base = '4c587de519cd4798c9b50397a6e125e9eb0e62f6'
          paths = subprocess.check_output(['git','diff','--name-only',base,'HEAD'], text=True).splitlines()
          expected = {'.github/workflows/ho01-measurement-checkpoint.yml'} | {f'.ho01-transfer/measurement.part{i}' for i in range(4)}
          if set(paths) != expected:
              raise SystemExit('branch changed outside transfer: refusing to apply')
          # Normalize identified text-transfer duplication only. Independent per-part
          # and whole decoded-patch checksums are mandatory before git apply.
          repairs = {
              0: [('ENbRRhdm','ENbRhdm'), ('JVuOO97','JVuO97'),
                  ('jNRiuoxJJDM','jNRiuoxJDM'), ('YQcnsGUU+','YQcnsGU+'),
                  ('maPvjnrrXX7','maPvjnrrX7'), ('5FBhNN0Vz','5FBhN0Vz'),
                  ('iFuQUUdHW','iFuQUdHW')],
              1: [('JqsvUKK2X','JqsvUK2X')]
          }
          hashes = ['6eaaf28b6e4f6275a2c807adc41c547ab7d7972a1cc84dc5a93507c5bcfd21b4',
                    'd1c4cf992bfc55a3aba843c9afe166173bde9c27c7aa056fd3fd67152e7b2212',
                    '8463b52dd6c6339561db6b33ced813d7fb11b5b4e33dc9e29f614ae73386920c',
                    '879ae76c96c45c58c464dab0ab4742c368bfbd57f46e3a82afa7d6fedd67edf2']
          parts = []
          invalid = []
          for i, expected_hash in enumerate(hashes):
              value = pathlib.Path(f'.ho01-transfer/measurement.part{i}').read_text().strip()
              for old, new in repairs.get(i, []):
                  value = value.replace(old, new)
              digest = hashlib.sha256(value.encode()).hexdigest()
              print(f'part {i}: {len(value)} characters, {digest}')
              pathlib.Path(f'/tmp/ho01-measurement/transfer/normalized.part{i}').write_text(value)
              if digest != expected_hash:
                  invalid.append(i)
              parts.append(value)
          if invalid:
              raise SystemExit(f'transfer checksum mismatch: {invalid}; no patch applied')
          patch = gzip.decompress(base64.b64decode(''.join(parts), validate=True))
          if hashlib.sha256(patch).hexdigest() != '4bbdabd63c7dc53bed51406ceca6fb27825179f0f5938485ccad4e8a06cc565c':
              raise SystemExit('decoded patch checksum mismatch; no patch applied')
          p = pathlib.Path('/tmp/ho01-measurement/measurement.patch'); p.write_bytes(patch)
          subprocess.run(['git','apply','--check','--index',str(p)], check=True)
          subprocess.run(['git','apply','--index',str(p)], check=True)
          changed = subprocess.check_output(['git','diff','--cached','--name-only'], text=True).splitlines()
          allowed = {'tools/lab.py','tools/ho01_records.py','tools/ho01_round.py',
                     'tests/test_aa_runtime.py','docs/RUNTIME.md','docs/DECISIONS.md',
                     '.github/workflows/ho01-validation.yml'}
          if not all(p in allowed or p.startswith('eval/lab/') for p in changed):
              raise SystemExit('unexpected patch destination')
          PY
      - name: Validate the applied Python 3.11 source and all fixtures
        shell: bash
        run: |
          python3 --version | tee /tmp/ho01-measurement/python-version.txt
          node --version | tee /tmp/ho01-measurement/node-version.txt
          python3 -m unittest discover -s tests -v 2>&1 | tee /tmp/ho01-measurement/unittest.txt
          python3 tools/check_kit.py 2>&1 | tee /tmp/ho01-measurement/check-kit.txt
      - name: Commit only after all validation passed
        shell: bash
        run: |
          git rm .github/workflows/ho01-measurement-checkpoint.yml .ho01-transfer/measurement.part*
          git config user.name 'AgenticArch HO-01'
          git config user.email 'stardustx8@users.noreply.github.com'
          git commit -m 'feat(ho01): add paired repeat trials, honest receipts and diverse fixtures'
          git push origin HEAD:refs/heads/pro/harness-opt-01
          git rev-parse HEAD > /tmp/ho01-measurement/source-sha.txt
          git archive --format=tar HEAD > /tmp/ho01-measurement/source.tar
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ho01-measurement-checkpoint
          path: /tmp/ho01-measurement/
          retention-days: 7
          if-no-files-found: error
